# 开发环境配置
app:
  jwt:
    secret: xiaoju-survey-dev-secret-key-2024
    expiration: 604800000 # 7 days

  crypto:
    aes-secret: xiaoju-survey-aes-dev-32-byte-key!!

  file:
    upload-dir: ./uploads
    # 文件存储配置
    storage:
      provider: LOCAL
      is-private-read: false
      file-key-prefix: "userUpload"
      need-auth: true
      link-expiry-time: "2h"

# Spring 配置
spring:
  application:
    name: xiaoju-survey

  # MongoDB 配置
  data:
    mongodb:
      host: localhost
      port: 27017
      database: xiaoju_survey_dev
      username: admin
      password: admin123
      authentication-database: admin
      auto-index-creation: true

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms

# Wow 框架配置
wow:
  events:
    # Event Store 配置 (使用 MongoDB)
    event-store:
      type: mongodb
      database: xiaoju_survey_dev
      collection: event_stream

    # 快照配置
    snapshot:
      enabled: true
      threshold: 100 # 每 100 个事件创建一次快照

  # Kafka 配置（如需事件流，可选）
  kafka:
    enabled: false

# 日志配置
logging:
  level:
    root: INFO
    site.weixing.natty: DEBUG
    me.ahoo.wow: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/xiaoju-survey-dev.log
    max-size: 100MB
    max-history: 30

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
